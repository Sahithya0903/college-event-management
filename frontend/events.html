<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Explore events — Evently</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-header"></div>

<header class="page-head">
  <div class="wrap">
    <h1>Explore events</h1>
    <p>Search by name, filter by category, location, date or price.</p>
  </div>
</header>

<div class="wrap">
  <form class="filter-bar" id="filter-form">
    <div class="field wide">
      <label for="q">Search</label>
      <input type="text" id="q" placeholder="Event name, topic, organizer…" />
    </div>
    <div class="field">
      <label for="category">Category</label>
      <select id="category"><option value="">All categories</option></select>
    </div>
    <div class="field">
      <label for="location">Location</label>
      <input type="text" id="location" placeholder="City" />
    </div>
    <div class="field">
      <label for="date">Month</label>
      <input type="month" id="date" />
    </div>
    <div class="field">
      <label for="fee">Price</label>
      <select id="fee">
        <option value="">Any price</option>
        <option value="free">Free</option>
        <option value="paid">Paid</option>
      </select>
    </div>
    <div class="field">
      <label for="sort">Sort by</label>
      <select id="sort">
        <option value="date">Date (soonest)</option>
        <option value="popular">Most popular</option>
        <option value="newest">Newly added</option>
        <option value="price_low">Price: low to high</option>
        <option value="price_high">Price: high to low</option>
      </select>
    </div>
    <div class="field" style="align-self:flex-end;">
      <button type="submit" class="btn btn-primary">Search</button>
    </div>
  </form>

  <div id="results-summary" style="margin-bottom:16px; color:var(--slate); font-size:0.9rem;"></div>
  <div class="card-grid" id="events-grid"><div class="spinner"></div></div>
  <div class="pagination" id="pagination"></div>
</div>

<div style="height:40px;"></div>
<div id="app-footer"></div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/cards.js"></script>
<script src="js/events.js"></script>
</body>
</html>
