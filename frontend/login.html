<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Evently</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-header"></div>
<div class="auth-shell">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to register for events and track your tickets.</p>
    <div id="form-error" class="form-error-banner hidden"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
    </form>
    <p class="auth-switch">New to Evently? <a href="register.html">Create an account</a></p>
    <p class="auth-switch" style="margin-top:6px; color:var(--slate-light); font-size:0.8rem;">Demo: admin@evently.test / Admin@12345</p>
  </div>
</div>
<div id="app-footer"></div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
